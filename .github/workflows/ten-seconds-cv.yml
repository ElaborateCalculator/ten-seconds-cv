name: ElaborateCalculator/ten-seconds-cv
on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type: "pull_request" to simulate a PR build, "push" for full build'
        required: true
        default: 'push'
        type: choice
        options:
          - push
          - pull_request
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Steps run on PRs and merges
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set base branch name for PRs
        run: echo "GHE_BRANCH=${BASE_BRANCH#refs/heads/}" >> $GITHUB_ENV
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        if: "${{ github.event_name == 'pull_request' }}"

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-extra texlive-pstricks ghostscript

      - name: Create PDF
        run: make all

      - name: Create readme image
        run: |
          make image
          make clean
        if: "${{ github.event_name == 'push' }}"

      - name: Checkin generated artifacts
        env:
          CI_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
        run: |
          if git diff --quiet -- cv-darren-rogers.pdf cv-darren-rogers.png; then
            echo "Generated artifacts are unchanged; nothing to commit."
            exit 0
          fi

          if [ -z "$CI_PUSH_TOKEN" ]; then
            echo "CI_PUSH_TOKEN secret is not configured."
            exit 1
          fi

          git config --global user.name 'GH Actions'
          git config --global user.email 'ghactions@users.noreply.github.com'
          git add cv-darren-rogers.pdf cv-darren-rogers.png
          git commit -m "[cicd] Checkin new PDF/image"
          git remote set-url origin "https://x-access-token:${CI_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        if: "${{ github.event_name == 'push' }}"
